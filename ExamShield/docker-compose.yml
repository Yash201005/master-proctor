services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: examshield, POSTGRES_PASSWORD: examshield, POSTGRES_DB: examshield }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://examshield:examshield@db:5432/examshield
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: http://localhost:5173
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { pgdata: {} }
